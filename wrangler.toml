# Cloudflare Pages project config.
#
# The site itself is a static export (see app/brookebrodack-site/static-export.ts);
# `functions/` adds the guestbook API on top of it, backed by D1.
#
# Secrets (set with `bunx wrangler pages secret put <NAME> --project-name=brookebrodack`):
#   GUESTBOOK_ADMIN_PASSWORD — password for /guestbook/admin
#   GUESTBOOK_ADMIN_SECRET   — HMAC key for the admin session cookie and IP hashing
name = "brookebrodack"
compatibility_date = "2026-07-18"
pages_build_output_dir = "app/brookebrodack-site/dist/browser"

# Schema lives in d1/migrations/ (distinct from app/brookebrodack-site/db/,
# which is the build-time SQLite used to render the static site). Apply with:
#   bunx wrangler d1 execute brookebrodack --remote --env-file /dev/null \
#     --file d1/migrations/<file>.sql
#
# `--env-file /dev/null` is required, not optional. This repo's .env is written
# for shell sourcing and holds
#   CLOUDFLARE_API_TOKEN="$(passage btak/CLOUDFLARE_API_TOKEN)"
# but wrangler auto-loads .env as dotenv, which does no command substitution —
# so it sends that literal `$(passage ...)` text as the credential. That is what
# produces "Invalid format for Authorization header [code: 6111]", and with only
# the account id expanded, "not authorized to access this service [code: 7403]".
# Neither is an expired login: the stored OAuth session carries d1:write and
# works fine once .env is kept out of the way.
#
# ORDERING: apply the migration BEFORE pushing code that reads the new column.
# Pages deploys on push, and a function selecting a column that does not exist
# yet fails closed and serves an error page for the whole API.
[[d1_databases]]
binding = "DB"
database_name = "brookebrodack"
database_id = "dc50a79e-5479-4685-ac29-4c7f15fa5c57"

# Push moderation to the freehold host instead of waiting for the 15-minute
# cron sweep. Binds the Pages project to workers/guestbook-dispatch, whose
# Durable Object holds the host's WebSocket open.
#
# Optional: unbound, the guestbook behaves exactly as it did before — inline
# moderation at submit, cron sweep behind it, admin dashboard for the rest.
# Deploy workers/guestbook-dispatch BEFORE adding this binding, or the Pages
# deploy fails on a service that does not exist yet.
[[services]]
binding = "FREEHOLD_HUB_SVC"
service = "brookebrodack-guestbook-dispatch"
