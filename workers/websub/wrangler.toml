name = "brookebrodack-websub"
main = "index.ts"
compatibility_date = "2024-12-01"

[triggers]
# Verify a stored live stream is still live every 5 min; re-subscribe weekly.
crons = ["*/5 * * * *", "0 0 */7 * *"]

[[kv_namespaces]]
# Holds the current live-stream status. Create with:
#   wrangler kv namespace create LIVE
# then paste the returned id below.
binding = "LIVE"
id = "188a89cb05ff46978f6b46a740215285"

[vars]
GH_OWNER = "btakita"
GH_REPO = "brookebrodack-dev"
GH_WORKFLOW = "deploy.yml"
YOUTUBE_CHANNELID = "UCO42ciP_nkDcOlATRjLXCqQ"
NOTIFICATION_EMAIL = "brian.takita@gmail.com"
FROM_EMAIL = "notifications@brookebrodack.net"

# Secrets (set via `wrangler secret put`):
# - GH_TOKEN: GitHub PAT with actions:write scope
# - WEBSUB_SECRET: Shared secret for HMAC verification
# - GOOGLE_API_KEY: Google API key with YouTube Data API v3 enabled (videos.list for live status)
