name: Check

# The deploy workflow builds and ships without ever running `typecheck` or
# `test`, which is how tsconfig.json sat in a state where the type-check had
# never run at all. This runs both on every push so that cannot recur.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Same yalc -> npm rewrite the deploy workflow uses; CI has no local
      # .yalc store.
      - name: Resolve yalc dependencies to npm
        run: |
          sed -i 's|"file:\.yalc/@rappstack/[^"]*"|"^0.1.0"|g' package.json
          rm -f bun.lock

      - run: bun install --ignore-scripts

      # public/assets is gitignored (119 MB of media) and lives in Contabo S3;
      # app/brookebrodack-site/config.ts imports the logo from it, so without
      # this the whole app test suite dies on an unresolved module. Same step
      # the deploy workflow uses.
      - name: Download assets
        run: |
          pip install awscli --quiet
          mkdir -p public/assets
          aws s3 cp s3://$AWS_BUCKET/ public/assets --recursive --endpoint-url $AWS_ENDPOINT_URL
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}

      - name: Type-check (edge)
        run: bun run typecheck

      # The two type-checks below are NOT gated yet. Neither reports a single
      # error in code this repo can fix: all 39 come from the yalc/npm
      # @rappstack sources, which ship .ts so skipLibCheck never applies —
      # 24 in @rappstack itself (a marked 13 -> 17 renderer signature, a zod
      # errorMap) and 15 where @rappstack/domain--server--youtube pins
      # drizzle-orm ^0.32.0 while @rappstack/domain--server pins ^0.45.1, so a
      # table type and a db handle come from two different drizzle universes.
      # Gate both once rappstack aligns those versions; a step that is red on
      # day one only teaches people to ignore it.
      #
      #   - run: bun run typecheck:browser
      #   - run: cd app/brookebrodack-site && bun run typecheck

      # app/brookebrodack-site/test/routes.test.ts spawns `bun ./start.ts` and
      # fetches it on :14101 — that is the production server, so it needs a
      # migrated db and a build to exist first, exactly as the test file's own
      # Prerequisites comment says. Without these two steps start.ts never
      # binds and all 20 route tests report ConnectionRefused, which reads like
      # a network problem rather than a missing build.
      - name: Initialize database
        run: cd app/brookebrodack-site && bun db/migrate.ts
        env:
          NODE_ENV: production
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          YOUTUBE_CHANNELID: ${{ secrets.YOUTUBE_CHANNELID }}
          YOUTUBE_RSS_URL: ${{ secrets.YOUTUBE_RSS_URL }}

      - name: Build
        run: bun run build
        env:
          NODE_ENV: production

      - run: bun run test
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          YOUTUBE_CHANNELID: ${{ secrets.YOUTUBE_CHANNELID }}
          YOUTUBE_RSS_URL: ${{ secrets.YOUTUBE_RSS_URL }}

      - run: bun run test:dom
